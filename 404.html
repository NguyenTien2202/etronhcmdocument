<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etron Onboarding - Đang chuyển hướng...</title>
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/48/handshake.png">
    <script>
        (function() {
            var path = window.location.pathname;
            var repoPrefix = path.indexOf('/etronhcmdocument') === 0 ? '/etronhcmdocument' : '';
            // Xử lý chuyển hướng cho URL dạng đẹp: /onboard/nhansudothitruclinh
            if (path.indexOf('/onboard/') !== -1) {
                var parts = path.split('/onboard/');
                var slug = (parts[1] || '').replace(/\/$/, '').trim();
                var search = window.location.search || '';
                var hash = window.location.hash || '';
                
                // Giữ nguyên các tham số nếu có
                var target = repoPrefix + '/onboard.html?' + encodeURIComponent(slug) + (search ? '&' + search.slice(1) : '') + hash;
                window.location.replace(target);
                return;
            }
            // Mặc định chuyển hướng về trang chủ
            window.location.replace((repoPrefix || '') + '/index.html');
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Cổng Hội Nhập Etron HCM</h2>
        <p>Đang chuẩn bị lộ trình học tập cá nhân của bạn, vui lòng đợi trong giây lát...</p>
    </div>
</body>
</html>
