<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etron Document - Đang chuyển hướng...</title>
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/48/handshake.png">
    <script>
        (function() {
            var path = window.location.pathname || '';
            var repoPrefix = path.indexOf('/etronhcmdocument') === 0 ? '/etronhcmdocument' : '';
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            // 1. Xử lý chuyển hướng cho Onboarding: /onboard/nhansudothitruclinh hoặc /onboard
            if (path.indexOf('/onboard') !== -1) {
                if (path.indexOf('/onboard/') !== -1) {
                    var parts = path.split('/onboard/');
                    var slug = (parts[1] || '').replace(/\/$/, '').trim();
                    var target = repoPrefix + '/onboard.html?' + encodeURIComponent(slug) + (search ? '&' + search.slice(1) : '') + hash;
                    window.location.replace(target);
                    return;
                }
                window.location.replace(repoPrefix + '/onboard.html' + search + hash);
                return;
            }

            // 2. Xử lý HR Hub: /hr
            if (path.indexOf('/hr') !== -1 && path.indexOf('/hr.html') === -1) {
                window.location.replace(repoPrefix + '/hr.html' + search + hash);
                return;
            }

            // 3. Xử lý các tab SalesHub (/baogia, /khotailieu, /callbot, v.v.)
            var cleanPath = path;
            if (repoPrefix && cleanPath.indexOf(repoPrefix) === 0) {
                cleanPath = cleanPath.slice(repoPrefix.length);
            }
            var route = cleanPath.replace(/^\/+/, '').replace(/\/+$/, '').toLowerCase().replace(/\.html$/i, '');

            var tabMap = {
                // Tạo Báo Giá
                'baogia': 'quote-builder',
                'bao-gia': 'quote-builder',
                'quote': 'quote-builder',
                'quote-builder': 'quote-builder',
                'quotes': 'quote-builder',
                // Kho Tài Liệu
                'khotailieu': 'documents',
                'kho-tai-lieu': 'documents',
                'tailieu': 'documents',
                'tai-lieu': 'documents',
                'documents': 'documents',
                'docs': 'documents',
                // Callbot & Kịch Bản
                'callbot': 'callbot-hub',
                'callbot-hub': 'callbot-hub',
                'kichban': 'callbot-hub',
                'kich-ban': 'callbot-hub',
                'callbot-ai': 'callbot-hub',
                // Lịch sử & Cài đặt
                'history': 'history',
                'lichsu': 'history',
                'lich-su': 'history',
                'settings': 'settings',
                'caidat': 'settings',
                'cai-dat': 'settings'
            };

            if (tabMap[route]) {
                var target = repoPrefix + '/index.html?tab=' + encodeURIComponent(tabMap[route]) + (search ? '&' + search.slice(1) : '') + hash;
                window.location.replace(target);
                return;
            }

            // Mặc định chuyển hướng về trang chủ
            window.location.replace((repoPrefix || '') + '/index.html' + search + hash);
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Etron Solution Hub</h2>
        <p>Đang chuyển hướng tới nội dung bạn cần, vui lòng đợi trong giây lát...</p>
    </div>
</body>
</html>
