    <script>
        (function() {
            var path = window.location.pathname || '';
            var repoPrefix = path.indexOf('/etronhcmdocument') === 0 ? '/etronhcmdocument' : '';
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            // 1. Xử lý chuyển hướng cho Onboarding: /onboard/nhansudothitruclinh hoặc /onboard
            if (path.indexOf('/onboard') !== -1) {
                if (path.indexOf('/onboard/') !== -1) {
                    var parts = path.split('/onboard/');
                    var slug = (parts[1] || '').replace(/\/$/, '').trim();
                    var target = repoPrefix + '/onboard.html?' + encodeURIComponent(slug) + (search ? '&' + search.slice(1) : '') + hash;
                    window.location.replace(target);
                    return;
                }
                window.location.replace(repoPrefix + '/onboard.html' + search + hash);
                return;
            }

            // 2. Xử lý HR Hub: /hr
            if (path.indexOf('/hr') !== -1 && path.indexOf('/hr.html') === -1) {
                window.location.replace(repoPrefix + '/hr.html' + search + hash);
                return;
            }

            // 3. Xử lý các tab SalesHub (/baogia, /khotailieu, /callbot, v.v.)
            var cleanPath = path;
            if (repoPrefix && cleanPath.indexOf(repoPrefix) === 0) {
                cleanPath = cleanPath.slice(repoPrefix.length);
            }
            var route = cleanPath.replace(/^\/+/, '').replace(/\/+$/, '').toLowerCase().replace(/\.html$/i, '');

            var tabMap = {
                // Tạo Báo Giá
                'baogia': 'quote-builder',
                'bao-gia': 'quote-builder',
                'quote': 'quote-builder',
                'quote-builder': 'quote-builder',
                'quotes': 'quote-builder',
                // Kho Tài Liệu
                'khotailieu': 'documents',
                'kho-tai-lieu': 'documents',
                'tailieu': 'documents',
                'tai-lieu': 'documents',
                'documents': 'documents',
                'docs': 'documents',
                // Callbot & Kịch Bản
                'callbot': 'callbot-hub',
                'callbot-hub': 'callbot-hub',
                'kichban': 'callbot-hub',
                'kich-ban': 'callbot-hub',
                'callbot-ai': 'callbot-hub',
                // Lịch sử & Cài đặt
                'history': 'history',
                'lichsu': 'history',
                'lich-su': 'history',
                'settings': 'settings',
                'caidat': 'settings',
                'cai-dat': 'settings'
            };

            if (tabMap[route]) {
                var target = repoPrefix + '/index.html?tab=' + encodeURIComponent(tabMap[route]) + (search ? '&' + search.slice(1) : '') + hash;
                window.location.replace(target);
                return;
            }

            // Mặc định chuyển hướng về trang chủ
            window.location.replace((repoPrefix || '') + '/index.html' + search + hash);
        })();
    </script>

        body {

            text-align: center;
            max-width: 420px;
            width: 100%;

        }

            to { transform: rotate(360deg); }
