<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-indigo-100 shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between py-2.5 sm:py-3 gap-2">
                <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
                    <img src="assets/logo.png" alt="ETRON HCM" class="h-9 w-9 sm:h-10 sm:w-10 rounded-full object-cover shadow-sm shrink-0 ring-1 ring-slate-200">
                    <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
                        <span class="font-extrabold text-slate-900 text-sm sm:text-base tracking-tight truncate">Etron Onboard</span>
                        <span class="text-[9px] sm:text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 shrink-0">Hội Nhập</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a href="index.html" class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 border border-slate-200 transition-all flex items-center gap-1.5 shadow-2xs" title="Mở SalesHub tài nguyên">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Mở SalesHub</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Onboarding Roadmap Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div id="onboarding-roadmap-viewer-root">
            <!-- Rendered dynamically by js/onboarding-viewer.js -->
        </div>
    </main>

    <!-- Media, PDF & Note Preview Modal (Giống hệt SalesHub để mở xem trực tiếp tài liệu PDF/Note trên cả máy tính và điện thoại) -->
    <div id="media-preview-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-2 sm:p-4 bg-slate-900/80 backdrop-blur-md"
        onclick="if(event.target === this) window.documentHub.closeMediaPreview()">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-3 sm:p-4 px-4 sm:px-6 bg-slate-900 text-white flex items-center justify-between">
                <div class="flex items-center gap-2.5 truncate">
                    <i data-lucide="eye" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                    <h4 id="media-preview-title" class="font-bold text-xs sm:text-sm truncate">Xem trước tài liệu</h4>
                </div>
                <div class="flex items-center gap-2">
                    <button id="media-preview-download-btn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white flex items-center gap-1.5 transition-colors hidden">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>Tải về</span>
                    </button>
                    <button onclick="window.documentHub.closeMediaPreview()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="media-preview-content" class="flex-1 bg-slate-100 p-2 sm:p-4 overflow-y-auto overflow-x-hidden min-h-[280px] max-h-[82vh]" style="-webkit-overflow-scrolling: touch; overscroll-behavior: contain;">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Modal xem ảnh bài nộp toàn màn hình -->
    <div id="submission-image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-xs"
        onclick="if(event.target === this) this.classList.add('hidden')">
        <div class="relative max-w-4xl max-h-[90vh] bg-white rounded-2xl overflow-hidden shadow-2xl flex flex-col animate-in fade-in zoom-in-95 duration-150">
            <div class="p-3 px-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
                <span class="text-xs font-bold flex items-center gap-1.5">
                    <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i>
                    <span>Xem ảnh bài tập nộp</span>
                </span>
                <div class="flex items-center gap-2">
                    <a id="submission-image-download" href="#" download="bai-tap-nop.png"
                        class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1 shadow-xs">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> <span>Tải về</span>
                    </a>
                    <button type="button" onclick="document.getElementById('submission-image-modal').classList.add('hidden')"
                        class="p-1 rounded-lg text-slate-400 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="p-2 sm:p-4 overflow-auto flex items-center justify-center bg-slate-900/10">
                <img id="submission-image-target" src="" alt="Ảnh bài tập" class="max-h-[75vh] object-contain rounded-lg shadow-sm">
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/sync-status.js?v=20261018_v87"></script>
    <script src="js/firebase-config.js?v=20261018_v87"></script>

    <!-- Core Scripts for Document Preview & Onboarding Roadmap -->
    <script src="js/store.js?v=20261018_v89"></script>
    <script src="js/document-hub.js?v=20261018_v90"></script>
    <script src="js/hr-onboarding-data.js?v=20261019_v92"></script>
    <script src="js/onboarding-viewer.js?v=20261019_v92"></script>
    <script>
        // Minimal salesApp shim for notifications & mobile modal scroll lock on standalone onboard.html
        window.salesApp = {
            showNotification(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                let colorClass = 'bg-slate-800 text-white border-slate-700';
                if (type === 'success') colorClass = 'bg-emerald-700 text-white border-emerald-600 shadow-emerald-900/20';
                else if (type === 'error') colorClass = 'bg-rose-800 text-white border-rose-700 shadow-rose-900/20';
                else if (type === 'warning') colorClass = 'bg-amber-700 text-white border-amber-600 shadow-amber-900/20';
                toast.className = `p-3.5 rounded-xl shadow-lg border text-xs font-bold transition-all duration-300 pointer-events-auto flex items-center gap-2 ${colorClass}`;
                toast.innerHTML = `<span>${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(8px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (window.salesStore) window.salesStore.setupCloudSync();
            if (window.documentHub) window.documentHub.init();
            if (window.onboardingViewer) window.onboardingViewer.init();

            // Re-render roadmap when documents sync from Cloud
            window.addEventListener('storage', () => {
                if (window.onboardingViewer) window.onboardingViewer.render();
            });

            // Mobile modal scroll lock for #media-preview-modal
            const modal = document.getElementById('media-preview-modal');
            if (modal) {
                let lockedScrollY = 0;
                let isLocked = false;
                const obs = new MutationObserver(() => {
                    const open = !modal.classList.contains('hidden');
                    if (open && !isLocked) {
                        lockedScrollY = window.scrollY || 0;
                        isLocked = true;
                        document.documentElement.classList.add('modal-open-lock');
                        document.body.classList.add('modal-open-lock');
                        document.body.style.top = `-${lockedScrollY}px`;
                    } else if (!open && isLocked) {
                        isLocked = false;
                        document.documentElement.classList.remove('modal-open-lock');
                        document.body.classList.remove('modal-open-lock');
                        document.body.style.top = '';
                        window.scrollTo(0, lockedScrollY);
                    }
                });
                obs.observe(modal, { attributes: true, attributeFilter: ['class'] });
            }

            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
